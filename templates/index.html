
<!DOCTYPE html>

<html>

<head>

<title>Spam Detection AI</title>

<meta name="viewport" content="width=device-width, initial-scale=1">


<style>

body{
    font-family: Arial;
    background:#eef2ff;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}


.card{
    background:white;
    width:90%;
    max-width:500px;
    padding:30px;
    border-radius:15px;
    box-shadow:0px 10px 30px #ccc;
}


h1{
    text-align:center;
    color:#1e3a8a;
}


textarea{
    width:100%;
    height:150px;
    padding:12px;
    font-size:16px;
    border-radius:10px;
    border:1px solid #ccc;
}


button{
    width:100%;
    margin-top:15px;
    padding:12px;
    font-size:18px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}


.result{
    margin-top:20px;
    padding:15px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    border-radius:10px;
}


.spam{
    background:#fee2e2;
    color:#991b1b;
}


.ham{
    background:#dcfce7;
    color:#166534;
}

</style>

</head>


<body>


<div class="card">


<h1>📩 Spam Detector AI</h1>


<form method="POST">


<textarea 
name="message"
placeholder="Enter SMS or email message..."
required>{{message}}</textarea>


<button type="submit">
Analyze Message
</button>


</form>


{% if prediction %}

<div class="result 
{% if 'SPAM' in prediction %}
spam
{% else %}
ham
{% endif %}
">

{{prediction}}

</div>

{% endif %}


</div>


</body>

</html>
